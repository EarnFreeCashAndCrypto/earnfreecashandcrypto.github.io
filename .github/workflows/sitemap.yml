name: Generate Sitemap

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write  # ⚠️ Add this line to allow write access

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate a sitemap

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate the sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://earnfreecashandcrypto.github.io/

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sitemap.xml
          git commit -m "Automatically generated sitemap.xml" || exit 0
          git push
