name: Generate Sitemap

on:
  push:
    branches: ["main"] # Triggers when code is pushed to the main branch
  workflow_dispatch: # Allows manual triggering

jobs:
  sitemap_job:
    runs-on: ubuntu-latest
    name: Generate a sitemap

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Must be 0 to get git commit history for generating lastmod

      - name: Generate the sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://earnfreecashandcrypto.github.io/ # ⚠️ Replace this with your actual website URL, note the trailing slash
          # Optional: If you want to remove .html suffix from URLs, you can add the following line (GitHub Pages supports this)
          # drop-html-extension: true
          
      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sitemap.xml
          git commit -m "Automatically generated sitemap.xml" || exit 0
          git push
